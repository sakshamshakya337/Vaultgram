<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />
  
  <!-- Outer glowing ring / Reels border -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#streamGrad)" stroke-width="18" stroke-dasharray="80 30" />
  
  <!-- Play & Stream Symbol -->
  <path d="M220 176 L340 256 L220 336 Z" fill="url(#streamGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Sparkle dots -->
  <circle cx="340" cy="180" r="12" fill="#06b6d4" />
  <circle cx="170" cy="320" r="10" fill="#ec4899" />
</svg>
